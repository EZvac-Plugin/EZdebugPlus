# EZdebug+: a Debug Potion that shows EZvac at work. /ezdb debug gives one;
# drinking it frames every EZvac sign and outlines the equipment near you, and
# working vents and equipment puff a small cloud: cyan while cooling, orange
# while heating. Only the player who drank it sees any of it. Milk ends it.

# How long a Debug Potion lasts.
duration-minutes: 8

# Devices are shown within this many blocks of you (4 to 128).
radius: 32

# How often outlines and clouds are redrawn, in ticks (20 = a second).
refresh-ticks: 10

# A vanilla effect shown for as long as it lasts, so the countdown is on
# screen. night_vision also helps in dark plant rooms; none shows nothing.
effect: night_vision

# Holding EZvac's link tool (EZvac 3.0 or newer) shows debug vision too, with
# no potion, for as long as it is in your hand. The system the tool has
# selected is drawn in the "selected" colour, so you see what you're linking
# to. Needs ezdebug.use or ezvac.admin.
link-tool: true

# Colours, as #RRGGBB: the frames around signs, equipment outlines, and clouds.
colors:
  thermostat: "#55FFFF"
  # Thermometers, hygrometers and thermo-hygrometers.
  thermometer: "#FFFFFF"
  rpm-monitor: "#FFFF55"
  settings-panel: "#FF77FF"
  sensor-hub: "#55FF55"
  # Dehumidifier and humidifier signs.
  climate-unit: "#5599FF"
  # Equipment that isn't running.
  stopped: "#8A8A8A"
  # Equipment running, and clouds, while cooling or heating.
  cooling: "#55DDFF"
  heating: "#FF9933"
  # The system selected on the link tool: its signs, equipment and vents.
  selected: "#FF4444"
